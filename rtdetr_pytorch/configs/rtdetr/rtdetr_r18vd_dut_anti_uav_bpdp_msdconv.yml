__include__: ['./rtdetr_r18vd_dut_anti_uav.yml']

# Complexity/integration configuration only; do not train in stage one.
output_dir: ./output/rtdetr_r18vd_dut_anti_uav_bpdp_msdconv

BackboneModification:
  bpdp: true
  msdconv: true

BDPD:
  position: stride4_to_8
  local_kernel: 3
  detail_floor: 0.25
  eps: 1.0e-6
  alpha_init: 0.5
  alpha_max: 1.0
  debug: false

MSDConv:
  position: p3
  groups: 8
  eps: 1.0e-6
  beta_init: 0.1
  beta_max: 0.5
  debug: false
