__include__: [
  './rtdetr_hrnetv2_w18_dut_anti_uav.yml',
]

# Pure Neck experiment. All settings are inherited unchanged from the formal
# HRNetV2-W18 DUT experiment. The existing Stage4 /4 branch is exposed only as
# SLR detail and never becomes an RT-DETR detector level.
output_dir: ./output/rtdetr_hrnetv2_w18_dut_anti_uav_slr

SLR:
  enabled: true
  detail_source_channels: 18
  query_dim: 32
  position_dim: 16
  alpha_max: 0.3
  alpha_init: 0.05
