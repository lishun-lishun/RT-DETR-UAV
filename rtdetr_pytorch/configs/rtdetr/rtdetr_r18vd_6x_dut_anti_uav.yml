__include__: [
  '../dataset/dut_anti_uav_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetr_r50vd.yml',
]

output_dir: ./output/rtdetr_r18vd_6x_dut_anti_uav

# The standard RT-DETR 6x schedule is 72 epochs.
epoches: 72

# Tuned for 3 x 24 GB GPUs:
#   per-GPU batch size = 24, global batch size = 24 * 3 = 72.
# Multi-scale training can randomly select resolutions up to 800x800, so some
# free memory is intentionally left for the largest scale.
train_dataloader:
  batch_size: 24
  num_workers: 8

val_dataloader:
  batch_size: 32
  num_workers: 8

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformer:
  eval_idx: -1
  num_decoder_layers: 3
  num_denoising: 100

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?=.*norm).*$'
      # Linear LR scaling: 1e-5 * (global batch 72 / reference batch 16).
      lr: 0.000045
      weight_decay: 0.
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.000045
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bias)).*$'
      weight_decay: 0.
  # Linear LR scaling: 1e-4 * (global batch 72 / reference batch 16).
  lr: 0.00045
  betas: [0.9, 0.999]
  weight_decay: 0.0001
