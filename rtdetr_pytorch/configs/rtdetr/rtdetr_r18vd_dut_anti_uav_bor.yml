# Pure Neck experiment. The complete data, optimization, schedule, EMA,
# detector and three-GPU protocol is inherited unchanged from the formal
# PResNet18 DUT baseline.
output_dir: ./output/rtdetr_r18vd_dut_anti_uav_bor

PAF:
  enabled: false

BOR:
  enabled: true
  outer_kernel: 7
  inner_kernel: 3
  theta: 0.25
  tau: 0.10
  alpha_max: 0.30
  alpha_init: 0.05
