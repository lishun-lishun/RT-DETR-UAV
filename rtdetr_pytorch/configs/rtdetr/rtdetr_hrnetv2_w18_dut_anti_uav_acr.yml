__include__: [
  './rtdetr_hrnetv2_w18_dut_anti_uav.yml',
]

# Pure Neck experiment: every training/data/detector setting is inherited from
# the existing HRNetV2-W18 DUT experiment. Only ACR and output_dir differ.
output_dir: ./output/rtdetr_hrnetv2_w18_dut_anti_uav_acr

ACR:
  enabled: true
  energy_calibration: true
  semantic_routing: true
  detail_routing: true

  scale_min: 0.5
  scale_max: 2.0
  detach_scale: true
  eps: 1.0e-6

  semantic:
    rho: 0.20
    theta: 0.0
    tau: 0.20

  detail:
    theta: 1.0
    tau: 0.50
    beta_max: 0.5
    beta_init: 0.1

  debug: false
  debug_interval: 100
