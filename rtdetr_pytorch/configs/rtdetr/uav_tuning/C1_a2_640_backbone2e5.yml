__include__: ['./uav_baseline_v1.yml']

# Fixed-640 learning-rate follow-up; run after selecting augmentation A2.
output_dir: ./output/uav_tuning/C1_a2_640_backbone2e5

optimizer:
  params:
    - params: '^(?=.*backbone)(?=.*norm).*$'
      lr: 0.00002
      weight_decay: 0.
    - params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00002
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bias)).*$'
      weight_decay: 0.
