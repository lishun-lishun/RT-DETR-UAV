__include__: ['./A2_no_zoom_crop04.yml']

output_dir: ./output/uav_tuning/B2_a2_960

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomIoUCrop, p: 0.4}
        - {type: SanitizeBoundingBox, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [960, 960]}
        - {type: ToImageTensor}
        - {type: ConvertDtype}
        - {type: SanitizeBoundingBox, min_size: 1}
        - {type: ConvertBox, out_fmt: 'cxcywh', normalize: true}

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [960, 960]}
        - {type: ToImageTensor}
        - {type: ConvertDtype}

# Conservative upper bound (1024) for 24-GiB cards at batch 16/GPU.
RTDETR:
  multi_scale: [800, 832, 864, 896, 928, 960, 960, 960, 992, 1024]

HybridEncoder:
  eval_spatial_size: [960, 960]

RTDETRTransformer:
  eval_spatial_size: [960, 960]
