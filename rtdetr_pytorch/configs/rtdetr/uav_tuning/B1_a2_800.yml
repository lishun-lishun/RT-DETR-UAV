__include__: ['./uav_baseline_v1.yml']

# Resolution-only follow-up, not the recommended fixed-640 comparison protocol.
output_dir: ./output/uav_tuning/B1_a2_800

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomIoUCrop, p: 0.4}
        - {type: SanitizeBoundingBox, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [800, 800]}
        - {type: ToImageTensor}
        - {type: ConvertDtype}
        - {type: SanitizeBoundingBox, min_size: 1}
        - {type: ConvertBox, out_fmt: 'cxcywh', normalize: true}

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [800, 800]}
        - {type: ToImageTensor}
        - {type: ConvertDtype}

RTDETR:
  multi_scale: [640, 672, 704, 736, 768, 800, 800, 800, 832, 864, 896, 928, 960]

# The evaluation caches must match the 800 validation input.
HybridEncoder:
  eval_spatial_size: [800, 800]

RTDETRTransformer:
  eval_spatial_size: [800, 800]
