__include__: ['./three_gpu_base.yml']

# Control: same learning rates as the successful one-GPU batch-16 baseline.
output_dir: ./output/uav_tuning/G48_lr1x

optimizer:
  params:
    - params: '^(?=.*backbone)(?=.*norm).*$'
      lr: 0.00001
      weight_decay: 0.
    - params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bias)).*$'
      weight_decay: 0.
  lr: 0.0001

