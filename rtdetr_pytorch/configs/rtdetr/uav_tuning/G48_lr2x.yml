__include__: ['./three_gpu_base.yml']

# Conservative large-batch candidate (recommended first).
output_dir: ./output/uav_tuning/G48_lr2x

optimizer:
  params:
    - params: '^(?=.*backbone)(?=.*norm).*$'
      lr: 0.00002
      weight_decay: 0.
    - params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00002
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bias)).*$'
      weight_decay: 0.
  lr: 0.0002

