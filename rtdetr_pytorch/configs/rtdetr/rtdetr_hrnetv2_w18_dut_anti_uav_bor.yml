__include__: [
  './rtdetr_hrnetv2_w18_dut_anti_uav.yml',
]

# Pure Neck experiment. HRNetV2-W18 and every inherited training parameter
# remain identical to the formal HRNet control; only BOR is enabled.
output_dir: ./output/rtdetr_hrnetv2_w18_dut_anti_uav_bor

PAF:
  enabled: false

BOR:
  enabled: true
  outer_kernel: 7
  inner_kernel: 3
  theta: 0.25
  tau: 0.10
  alpha_max: 0.30
  alpha_init: 0.05
