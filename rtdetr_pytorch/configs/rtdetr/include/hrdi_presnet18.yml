# HRDI adapter for the real PResNet18 C2 output (64 channels, stride 4).
HRDI:
  enabled: true
  source: c2
  source_channels: 64
  source_stride: 4
  targets: [P3, P4]
  use_dwconv: true
  kernel_size: 3
  norm: BN
  activation: SiLU
  resize_mode: bilinear
  align_corners: false
  init_alpha: 0.0
  per_level_alpha: true
