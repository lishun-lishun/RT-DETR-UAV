# DUT-Anti-UAV contains a few high-resolution images (up to 5616x3744).
# Resize them before RandomZoomOut so the augmentation cannot create an
# extremely large intermediate PIL image and trigger DecompressionBombError.
# The dataset is dominated by small UAVs, so use 800x800 model inputs and limit
# ZoomOut to 2x (with lower probability) instead of the torchvision 4x default.
train_dataloader:
  dataset:
    return_masks: False
    transforms:
      ops:
        - {type: Resize, size: 799, max_size: 800}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0, side_range: [1.0, 2.0], p: 0.3}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBox, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [800, 800]}
        - {type: ToImageTensor}
        - {type: ConvertDtype}
        - {type: SanitizeBoundingBox, min_size: 1}
        - {type: ConvertBox, out_fmt: 'cxcywh', normalize: True}
  shuffle: True
  batch_size: 4
  num_workers: 4
  collate_fn: default_collate_fn

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [800, 800]}
        - {type: ToImageTensor}
        - {type: ConvertDtype}
  shuffle: False
  batch_size: 8
  num_workers: 4
  collate_fn: default_collate_fn
