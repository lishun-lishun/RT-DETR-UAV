# Paired Target-Surround Differential Attention experiment switch.
# This dictionary is consumed only by RTDETRTransformer's Decoder
# Cross-Attention constructor.  Removing it (or setting enabled: false)
# restores the exact original MSDeformableAttention implementation.
RTDETRTransformer:
  decoder_cross_attention:
    type: paired_target_surround
    enabled: true
    surround:
      enabled: true
      scale: 1.8
    differential:
      enabled: true
    gated_fusion:
      enabled: true
      init_bias: -2.0
    debug: false
