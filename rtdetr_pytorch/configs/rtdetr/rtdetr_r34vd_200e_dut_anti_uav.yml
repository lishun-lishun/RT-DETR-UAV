__include__: [
  '../dataset/dut_anti_uav_detection.yml',
  '../runtime.yml',
  './include/dataloader_dut_anti_uav.yml',
  './include/optimizer.yml',
  './include/rtdetr_r50vd.yml',
  './include/dut_anti_uav_200e.yml',
]

output_dir: ./output/rtdetr_r34vd_200e_800_dut_anti_uav

# Tuned for 3 x 24 GB GPUs: global batch size = 16 * 3 = 48.
train_dataloader:
  batch_size: 16
  num_workers: 8

val_dataloader:
  batch_size: 24
  num_workers: 8

PResNet:
  depth: 34
  freeze_at: -1
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformer:
  num_decoder_layers: 4

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      weight_decay: 0.
      lr: 0.00001
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
